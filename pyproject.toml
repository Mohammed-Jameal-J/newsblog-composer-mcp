[project]
name = "newsblog-composer-mcp"
version = "0.3.3"
description = "MCP server that researches, verifies and audits news blog posts. The writer writes the prose."
readme = "README.md"
authors = [{ name = "Mohammed Jameal J" }]
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=2.0",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "feedparser>=6.0",
  # zoneinfo has no tz database on Windows without this
  "tzdata>=2024.1; sys_platform == 'win32'",
]

license = "MIT"
keywords = ["mcp", "model-context-protocol", "seo", "journalism", "schema-org", "writing"]
# No "License :: OSI Approved" classifier here on purpose. PEP 639 sets
# License-Expression from the `license` field above, and PyPI rejects an upload
# that carries both. A rejected upload still burns the version number.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.urls]
Homepage = "https://github.com/Mohammed-Jameal-J/newsblog-composer-mcp"
Issues = "https://github.com/Mohammed-Jameal-J/newsblog-composer-mcp/issues"

[project.scripts]
newsblog-composer-mcp = "newsblog_mcp.server:main"
newsblog-mcp = "newsblog_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The sdist otherwise sweeps up whatever is sitting in the project folder -
# mcp-publisher.exe took one release from 112 KB to 7.5 MB. List what belongs
# in it rather than trying to name everything that does not.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/server.json",
  "/.env.example",
]

[tool.hatch.build.targets.wheel]
packages = ["src/newsblog_mcp"]
